services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: eduintel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: eduintel
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  chromadb:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - chromadata:/chroma/chroma

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      - postgres
      - chromadb
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  chromadata:
  uploads:
  caddy_data:
  caddy_config: